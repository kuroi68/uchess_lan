# GoReleaser configuration (schema version 2).
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    # Remove this if you don't use go modules.
    - go mod download
    # Remove this if you don't need go generate.
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/uchess/main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
    goarm:
      - "5"

archives:
  - format: binary
    # v2 removed the `replacements` key. Reproduce the legacy asset naming
    # (darwin -> osx, amd64 -> x86_64, 386 -> i386) with a name template.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}osx{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
